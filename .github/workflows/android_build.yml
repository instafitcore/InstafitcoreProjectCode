name: Build InstaFitCore (AAB Factory)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        # This builds your Next.js project and prepares the 'out' folder
        run: |
          npm install
          mkdir -p out
          touch out/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Generate Keystore Inside GitHub
        # We create the key here so you don't need it on your PC
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias instafit_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass instafit2026 \
            -keypass instafit2026 \
            -dname "CN=InstaFit, O=Dev, C=IN"

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        # This uses the password 'instafit2026' we created 2 steps ago
        run: |
          jarsigner -keystore release.keystore \
            -storepass instafit2026 \
            -keypass instafit2026 \
            android/app/build/outputs/bundle/release/app-release.aab \
            instafit_alias

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: InstaFitCore-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
