name: Build InstaFitCore (AAB Factory)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          mkdir -p out
          touch out/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Force Package Name & Version
        run: |
          # 1. Replace ALL instances of the old ID with the new one in the entire Android folder
          grep -rli 'com.instafitcore.apps' android | xargs -i@ sed -i 's/com.instafitcore.apps/com.instafitcore.appss/g' @
          
          # 2. Specifically remove the 'package' attribute from Manifest to fix Gradle 8+ conflict
          sed -i 's/package="com.instafitcore.appss"//g' android/app/src/main/AndroidManifest.xml
          
          # 3. Bump version code to 3 (in case version 2 was already "used" by a failed upload)
          sed -i 's/versionCode [0-9]*/versionCode 3/g' android/app/build.gradle

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          jarsigner -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: InstaFitCore-V3-Signed
          path: android/app/build/outputs/bundle/release/app-release.aab