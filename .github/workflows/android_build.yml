name: Build InstaFitCore (AAB Factory)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          mkdir -p out
          # Ensures Capacitor has a web directory to sync
          touch out/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Update Version Code & Package Name
        # This section fixes the AndroidManifest error and updates identity
        run: |
          cd android/app
          # 1. Update Version Code to 2 (to fix 'Version 1 already used' error)
          sed -i 's/versionCode 1/versionCode 2/g' build.gradle
          
          # 2. Update Package Name to the plural version Google expects
          sed -i 's/com.instafitcore.app/com.instafitcore.apps/g' build.gradle
          
          # 3. FIX: Remove the hardcoded package attribute from Manifest (Required for Gradle 8+)
          sed -i 's/package="[^"]*"//g' src/main/AndroidManifest.xml

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          jarsigner -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: InstaFitCore-V2-Signed
          path: android/app/build/outputs/bundle/release/app-release.aab