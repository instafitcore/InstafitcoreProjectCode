name: Build InstaFitCore (APK & AAB)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ✅ Install dependencies ONLY (no fake out folder)
      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Sync Capacitor
      - name: Capacitor Sync
        run: npx cap sync android

      # ✅ Build APK & AAB
      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      # ❌ REMOVE signing step (Play Store will handle it)
      # No keytool, no jarsigner needed

      # ✅ Upload APK (for testing)
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ✅ Upload AAB (for Play Store)
      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab