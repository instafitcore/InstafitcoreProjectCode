name: Build InstaFitCore (AAB Factory)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          mkdir -p out
          touch out/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Update Version Code & Package Name
        # This force-cleans the Android files to ensure no conflicts
        run: |
          cd android/app
          # Ensure version is at least 2
          sed -i 's/versionCode [0-9]*/versionCode 2/g' build.gradle
          # Ensure package name is correct
          sed -i 's/com.instafitcore.app/com.instafitcore.apps/g' build.gradle
          # Remove problematic package attribute from Manifest
          sed -i 's/package="[^"]*"//g' src/main/AndroidManifest.xml

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          # This builds the unsigned AAB
          ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          # This step uses your secret key to sign the built AAB
          jarsigner -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: InstaFitCore-V2-Signed
          path: android/app/build/outputs/bundle/release/app-release.aab