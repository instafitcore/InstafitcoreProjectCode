name: Build InstaFitCore (APK & Signed AAB)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ✅ Install dependencies ONLY (no fake out folder)
      - name: Install Dependencies
        run: npm install

      # ✅ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ✅ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Sync Capacitor
      - name: Capacitor Sync
        run: npx cap sync android

      # ✅ Build APK & AAB
      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      # ✅ SIGN AAB (required for Play Store)
      - name: Sign the AAB
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias instafit_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass instafit123 -keypass instafit123 -dname "CN=InstaFitCore, O=Dev, C=IN"

          jarsigner -keystore release.keystore -storepass instafit123 -keypass instafit123 android/app/build/outputs/bundle/release/app-release.aab instafit_alias

      # ✅ Upload Debug APK (for testing)
      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ✅ Upload Signed AAB (for Play Store)
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab