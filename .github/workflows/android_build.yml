name: Build InstaFitCore (APK & Signed AAB)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      # ✅ USE YOUR REAL KEY (VERY IMPORTANT)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > instafit.keystore

      # ✅ Build AAB
      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      # ✅ Sign with YOUR key
      - name: Sign the AAB
        run: |
          jarsigner -keystore instafit.keystore -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} android/app/build/outputs/bundle/release/app-release.aab ${{ secrets.KEY_ALIAS }}

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
