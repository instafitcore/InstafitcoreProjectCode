name: Build InstaFitCore (APK & Signed AAB)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      # ✅ Build Next.js for production
      - name: Build Next.js
        run: npm run build && npm run export

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Generate & Sign AAB
        run: |
          cd android
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias instafit_alias \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass instafit123 \
            -keypass instafit123 \
            -dname "CN=InstaFitCore, O=Dev, C=IN"

          jarsigner -keystore release.keystore \
            -storepass instafit123 \
            -keypass instafit123 \
            android/app/build/outputs/bundle/release/app-release.aab \
            instafit_alias

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Instafit-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
